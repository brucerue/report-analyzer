name: golden
# 실제 DART 보고서로 목차 나누기 확인 (수동 실행). 공개 저장소라 무료.
on:
  workflow_dispatch:
jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/golden.py
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
