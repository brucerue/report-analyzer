name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tests/test_core.py
      - run: python tests/test_points.py
      - run: python tests/test_plant.py
      - run: python tests/test_compare.py
      - run: python tests/test_news.py
      - run: python tests/test_article.py
      - run: python tests/test_claude.py
      - run: python tests/test_app.py
